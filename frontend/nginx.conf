server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-Kompression für große layer.Y.json Dateien & Bundles
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 256;

    # Vue Router SPA Support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aktuelle Layer-JSONs immer frisch ausliefern
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
